<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A8FB5"/><stop offset="1" stop-color="#0E4F6B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6CDB4"/><stop offset="1" stop-color="#E3A58A"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F8FF" stop-opacity=".55"/><stop offset="1" stop-color="#9FDDF5" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8FD8F7"/>
    </linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- yema del dedo -->
    <path d="M66 210 V168 C66 140 134 140 134 168 V210 Z" fill="url(#skin)"/>
    <!-- lente (cuenco, concavidad arriba) -->
    <path d="M38 118 C42 166 158 166 162 118 Z" fill="url(#lens)"/><path d="M38 118 C42 166 158 166 162 118" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <ellipse cx="100" cy="118" rx="62" ry="15" fill="#CFF0FF" fill-opacity=".45" stroke="#FFFFFF" stroke-width="3"/>
    <!-- superficie del liquido y ondas -->
    <ellipse cx="100" cy="123" rx="48" ry="9.5" fill="#6CC6EA" fill-opacity=".55"/>
    <ellipse cx="100" cy="123" rx="30" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity=".9"/>
    <ellipse cx="100" cy="123" rx="14" ry="2.8" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <!-- brillo -->
    <path d="M52 132 C58 148 74 154 88 156" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity=".75"/>
    <!-- gota cayendo -->
    <path d="M100 30 C100 30 85 54 85 65 A15 15 0 0 0 115 65 C115 54 100 30 100 30 Z" fill="url(#drop)" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M93 64 A7 7 0 0 0 98 72" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="100" cy="95" r="2.2" fill="#FFFFFF" fill-opacity=".85"/>
    <circle cx="100" cy="104" r="1.5" fill="#FFFFFF" fill-opacity=".6"/>
  </g>
</svg>
